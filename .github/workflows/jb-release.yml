name: JB Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: JB Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'bjesuiter/cross-keychain' && github.ref_name == 'release/bjesuiter'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci

      - name: Compute next JB prerelease version
        id: jb_version
        run: |
          NEXT_VERSION=$(node ./scripts/next-jb-version.mjs)
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next release version: $NEXT_VERSION"

      - name: Set package version
        run: npm version "${{ steps.jb_version.outputs.version }}" --no-git-tag-version

      - name: Publish to npm (trusted publishing)
        run: npm publish --provenance --access public --tag jb
